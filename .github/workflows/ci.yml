name: CI

on:
  pull_request:
  push:
    branches: [ "main", "master" ]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get (workspace)
        run: flutter pub get

      - name: Format check
        run: dart pub global activate melos && dart pub global run melos exec -- dart format --output=none --set-exit-if-changed .

      - name: Analyze (all packages)
        run: dart pub global activate melos && dart pub global run melos exec -- flutter analyze

      - name: Test (all packages)
        run: dart pub global activate melos && dart pub global run melos exec -- flutter test

